
name: Windows 11 EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Windows EXE
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name KoreanFileRenamer `
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KoreanFileRenamer-Windows11
          path: dist/KoreanFileRenamer.exe
          if-no-files-found: error
